name: CI

on:
  push:
    branches: [main, develop, security_hardening]
  pull_request:

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # frontend/ and backend/ each keep their own package-lock.json (SEC-16),
  # even though the root package.json also declares an npm "workspaces"
  # field. That combination means a plain `npm ci`/`npm install` run from
  # inside either directory gets silently redirected by npm to resolve
  # against the ROOT instead — see SECURITY_AUDIT.md's "npm workspace
  # install scoping" note. Every install step below passes
  # --workspaces=false --include-workspace-root=false to force npm to
  # treat that directory as its own project and use its own lockfile.
  frontend-checks:
    name: Frontend lint, typecheck, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --workspaces=false --include-workspace-root=false
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:prod

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --workspaces=false --include-workspace-root=false
      - run: npm test

  e2e:
    name: Playwright smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --workspaces=false --include-workspace-root=false
      - run: npm ci --workspaces=false --include-workspace-root=false
        working-directory: backend
      - run: npm ci --workspaces=false --include-workspace-root=false
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=e2e/playwright.config.ts

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: backend (hard gate — currently clean)
        working-directory: backend
        run: npm audit --audit-level=high --workspaces=false --include-workspace-root=false
      - name: frontend (informational — see SECURITY_AUDIT.md for the deferred tailwindcss-v3/braces dev-toolchain findings)
        working-directory: frontend
        run: npm audit --audit-level=high --workspaces=false --include-workspace-root=false
        continue-on-error: true

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
